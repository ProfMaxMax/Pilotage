<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pilotage pédagogique</title>
  <meta name="description" content="Agenda, progression et bibliothèque de séances, avec les prompts pour Claude.">
  <meta name="theme-color" content="#1f5f99">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pilotage">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Pilotage</div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <button id="syncBtn" class="syncbtn" data-a="syncMenu" hidden></button>
  </header>
  <main id="view"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <input type="file" id="agendaFileInput" accept=".csv,.xlsx,.txt,text/csv" hidden>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
